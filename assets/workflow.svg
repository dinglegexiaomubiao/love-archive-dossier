<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="900" height="320" fill="#0f1115"/>
  <text x="24" y="44" fill="#E6E8EB" font-size="20" font-weight="700">六步工作流</text>
  <text x="24" y="68" fill="#8A93A0" font-size="13">从聊天导出到一份可打印的关系档案</text>
  <g>
    <!-- boxes -->
    <rect x="24" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="88" cy="150" r="18" fill="#E8A33D"/><text x="88" y="156" fill="#0f1115" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="88" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">取数</text>
    <text x="88" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">微信导出 JSON</text>

    <rect x="166" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="230" cy="150" r="18" fill="#E8A33D"/><text x="230" y="156" fill="#0f1115" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="230" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">准备</text>
    <text x="230" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">init 准备工程</text>

    <rect x="308" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="372" cy="150" r="18" fill="#E8A33D"/><text x="372" y="156" fill="#0f1115" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="372" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">精读</text>
    <text x="372" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">三筛子定位</text>

    <rect x="450" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="514" cy="150" r="18" fill="#E8A33D"/><text x="514" y="156" fill="#0f1115" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="514" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">填六段</text>
    <text x="514" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">AI 写六段 HTML</text>

    <rect x="592" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="656" cy="150" r="18" fill="#E8A33D"/><text x="656" y="156" fill="#0f1115" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <text x="656" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">合并</text>
    <text x="656" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">build 合并</text>

    <rect x="734" y="110" width="128" height="150" rx="12" fill="#15191f" stroke="#2a3139"/>
    <circle cx="798" cy="150" r="18" fill="#E0353F"/><text x="798" y="156" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">6</text>
    <text x="798" y="200" fill="#E6E8EB" font-size="14" font-weight="700" text-anchor="middle">交付</text>
    <text x="798" y="224" fill="#8A93A0" font-size="11" text-anchor="middle">单文件 HTML</text>

    <!-- arrows -->
    <text x="159" y="186" fill="#6b7280" font-size="20" text-anchor="middle">›</text>
    <text x="301" y="186" fill="#6b7280" font-size="20" text-anchor="middle">›</text>
    <text x="443" y="186" fill="#6b7280" font-size="20" text-anchor="middle">›</text>
    <text x="585" y="186" fill="#6b7280" font-size="20" text-anchor="middle">›</text>
    <text x="727" y="186" fill="#6b7280" font-size="20" text-anchor="middle">›</text>
  </g>
  <text x="24" y="304" fill="#525a66" font-size="11">全部在本地运行 · 聊天数据不上传 · 图中为模拟数据演示</text>
</svg>
