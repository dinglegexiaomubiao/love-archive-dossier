# 恋爱档案 · 配置模板
# 【一句话模式】不必手动改：solo_pipeline.py 会按本模板生成 config-NN-XXX.toml，
#               只替换 path / me / other / title / output.dir 五个键。
# 【手工模式】复制为 config.toml 后修改。第二段关系复制为 config-02.toml，只改 path / me / other。
# ⚠ [stats] 三件套（session_gap_hours / reply_delay_max_hours / strict_parties）与 [emotion]
#    词表跨档案必须一致，否则数字不可比；solo_pipeline.py 生成后会复核，被改动即报错。

# ─────────────────────────────────────────────
# 一、数据源
# ─────────────────────────────────────────────
[source]
# wechat-export : wechat-chat-export 等工具导出的 JSON（含 messages 数组）
# jsonl         : 每行一个 JSON 对象
# csv           : 逗号分隔，首行表头
# txt           : 每行形如 [2022-02-15 13:25] 张三: 内容
format = "wechat-export"
path = "C:/Users/你/Documents/WeChat Exports/某人_xxx/聊天记录.json"

# 非 wechat-export 格式时，用字段名映射（按你文件里的实际列名填）
# [source.fields]
# time = "时间"
# sender = "发送者"
# content = "内容"
# type = "类型"

# ─────────────────────────────────────────────
# 二、元信息
# ─────────────────────────────────────────────
[meta]
title = "恋爱档案"
# 你的名字/代号，需与数据里的 sender 完全一致。留空则自动取发言最多的一方。
me = ""
# 对方的名字/代号。
other = ""
# 无时区信息的时间按这个偏移解释
timezone_offset = 8

# ─────────────────────────────────────────────
# 三、统计口径（跨档案必须保持一致，否则数字不可比）
# ─────────────────────────────────────────────
[stats]
# 相邻消息间隔超过这个小时数，算一场新对话
session_gap_hours = 4
# 回复延迟统计时，超过这个小时数的间隔视为中断，不参与计算
reply_delay_max_hours = 24
night_hours = [0, 1, 2, 3, 4]
# 口头禅最低出现次数
phrase_min_count = 30
top_words = 60
# 合并转发展开后会出现第三方 sender（群成员/被转发者），会污染开场归属、
# 月度分布，甚至把关系起点伪造成几年前。默认只保留 me/other/系统 三方。
# 详见 references/pitfalls.md 第 14 条。设 false 可恢复旧行为（不建议）。
strict_parties = true

# ─────────────────────────────────────────────
# 四、拐点检测
# ─────────────────────────────────────────────
[detect.spike]
# 当日量 ≥ 前 window_days 日均 × ratio，且绝对量 ≥ min_messages、绝对增量 ≥ min_delta
ratio = 2.5
min_messages = 80
min_delta = 50
window_days = 7

# 月度环比下滑拐点（抓「渐进退潮」，突变检测抓不到）
trend_drop_ratio = 0.75
trend_min_drop = 500

# 阶段切分粒度
max_phases = 10
min_phase_days = 14

# ─────────────────────────────────────────────
# 五、关键词分组（用于定位事件窗口）
# ─────────────────────────────────────────────
[detect.keywords]
"关系确认" = "在一起|做我女朋友|男朋友|女朋友|表白|喜欢你|我爱你|答应我|分手|在一起吧"
"思念" = "想你|想见你|好想|睡不着|梦到你"
"见面" = "见面|见你|来找你|去找你|出来玩|一起去看|车站|接你|送你|高铁|动车"
"亲密" = "抱抱|亲亲|牵手|靠一下|牵|搂"
"冲突" = "生气了|别生气|对不起|我错了|吵架|冷战|不理你|算了|受不了|烦死"
"家庭" = "我妈|我爸|你爸妈|见家长|我家里|结婚|相亲|催"
"礼物" = "礼物|生日|纪念日|情人节|七夕|送你|给你买|快递|特产"

# ─────────────────────────────────────────────
# 六、主题类目（正则，统计你们都在聊什么）
# ─────────────────────────────────────────────
[topics.categories]
"食物" = "火锅|烧烤|外卖|奶茶|咖啡|吃饭|夜宵|零食|蛋糕|水果|糖|螺蛳粉|麻辣烫"
"工作" = "工作|上班|加班|面试|简历|offer|工资|实习|招聘|试用期"
"学业" = "考试|论文|作业|上课|老师|毕业|答辩|考研|毕设|绩点|奖学金"
"娱乐" = "游戏|电影|电视剧|综艺|音乐|小说|追剧|王者|吃鸡|开黑"
"身体" = "感冒|发烧|头疼|胃疼|医院|吃药|不舒服|睡不着|姨妈|痛经"
"情绪" = "开心|难过|烦|累|焦虑|害怕|委屈|烦死|难受"
"异地" = "异地|距离|高铁|动车|车票|见面|多久没见"

# ─────────────────────────────────────────────
# 七、情绪词表（跨档案固定，否则正负比不可比）
# ─────────────────────────────────────────────
[emotion]
positive = "开心|高兴|快乐|嘻嘻|嘿嘿|哈哈|好耶|太棒|喜欢|幸福|舒服|满足|可爱|想你"
negative = "难受|烦|累|哭|委屈|生气|讨厌|不想|崩|焦虑|害怕|孤独|算了|受不了|烦死"

# ─────────────────────────────────────────────
# 八、停用词补充
# ─────────────────────────────────────────────
[stopwords]
extra = ["表情", "图片", "链接", "视频", "文件", "语音", "转账", "红包", "朋友圈"]

# ─────────────────────────────────────────────
# 九、输出
# ─────────────────────────────────────────────
[output]
dir = "out"
